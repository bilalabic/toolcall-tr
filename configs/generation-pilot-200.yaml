# 200 örneklik ücretli OpenAI kalibrasyon koşusu.
# Anahtar bu dosyaya yazılmaz; yalnız OPENAI_API_KEY ortam değişkeninden okunur.
llm:
  provider: template
  api: responses

  models:
    generator:
      model: gpt-4.1-mini
      reasoning_effort: none
      temperature: 1.0
      max_output_tokens: 512
      verbosity: low

    judge:
      model: gpt-5-mini
      reasoning_effort: low
      temperature: null
      max_output_tokens: 4096
      verbosity: low

  cache:
    enabled: true
    path: data/llm_cache
    key_fields: [prompt_version, blueprint_id, variant_index, model]

  concurrency:
    max_in_flight: 7

  retry:
    max_attempts: 4
    initial_delay_seconds: 1.0
    max_delay_seconds: 30.0
    backoff_multiplier: 2.0
    jitter: true

  budget:
    max_requests: 450
    max_input_tokens: 400000
    max_output_tokens: 120000

  fallback:
    on_generation_error: fail
    on_budget_exceeded: stop
    on_judge_error: reject

prompts:
  user_query: toolcall-tr-user-v6
  path: prompts/
  file: user_query_v6.md
  mode: synthesize

styles:
  - resmi
  - gunluk
  - eksiltili
  - yazim_hatali
  - dolayli
  - uzun_baglam
  - karisik_dil

constraints:
  no_new_ground_truth: true
  no_tool_names_in_message: true
  no_leaking_missing_params: true
  no_unsupported_tasks: true
  no_real_personal_data: true

normalization:
  money: true
  dates: true
  phone: true
