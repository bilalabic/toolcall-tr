  - tool: accounting.get_invoice
    arguments:
      invoice_id: "$actions[0].invoice.invoice_id"

assertions:
  - path: invoices.#1.status
    op: eq
    value: draft
    description_tr: Oluşturulan test faturasının durumu taslak olmalı.
