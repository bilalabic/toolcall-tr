blueprint_id: calendar_create_confirmed_meeting_001
family_id: calendar_create_confirmed_meeting
split: train
domain: calendar
kind: confirmation_required
difficulty: hard
interaction_type: multi_turn
provider: calendar_mock
user_goal: Takım eşgüdüm toplantısını açık onayla çalışma takvimine eklemek
known_information:
  title: Takım eşgüdüm toplantısı
context:
  target_calendar_id: work
  normalized_start_at: "2026-08-03T10:00:00+03:00"
  normalized_end_at: "2026-08-03T10:30:00+03:00"
  normalized_timezone: Europe/Istanbul
conversation_prefix:
  - role: user
    content: "3 Ağustos 2026 saat 10.00'da yarım saatlik Takım eşgüdüm toplantısı eklemek istiyorum."
  - role: assistant
    content: "Toplantıyı çalışma takviminize eklememi açıkça onaylıyor musunuz?"
available_tools: [calendar.search_events, calendar.create_event, calendar.cancel_event]
utterances:
  - "Evet, Takım eşgüdüm toplantısını çalışma takvimime eklemeni açıkça onaylıyorum."
  - "Takım eşgüdüm toplantısını oluşturman için onay veriyorum."
expected_behavior: { decision: tool_call }
expected_actions:
  - tool: calendar.create_event
    arguments:
      calendar_id: { value: work, origin: system_state }
      title: { value: Takım eşgüdüm toplantısı, origin: user_message }
      start_at: { value: "2026-08-03T10:00:00+03:00", origin: system_state }
      end_at: { value: "2026-08-03T10:30:00+03:00", origin: system_state }
      timezone: { value: Europe/Istanbul, origin: system_state }
      confirmed: { value: true, origin: user_message }
