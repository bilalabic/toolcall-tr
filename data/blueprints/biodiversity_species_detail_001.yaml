utterances:
  - "Quercus robur türünün taksonomik sınıflandırmasını göster."
  - "Quercus robur hangi familya ve cinse ait?"

expected_behavior:
  decision: tool_call

expected_actions:
  - tool: biodiversity.match_species_name
