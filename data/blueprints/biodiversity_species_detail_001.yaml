blueprint_id: biodiversity_species_detail_001
family_id: biodiversity_species_detail
split: train
domain: biodiversity
kind: sequential_tool_call
difficulty: easy
provider: gbif

user_goal: Quercus robur türünün taksonomik sınıflandırmasını öğrenmek
known_information:
  scientific_name: Quercus robur

available_tools:
  - biodiversity.match_species_name
  - biodiversity.get_species
  - biodiversity.search_occurrences
